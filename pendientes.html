<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendientes del comité</title>
<meta name="description" content="Casos del padrón del agua de La Florida que el Comité tiene que aclarar.">
<link rel="icon" href="assets/gota.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css?v=20261125">
</head>
<body>
<div class="ola-top">
  <div class="dentro">
    <span class="etiqueta">Para la próxima reunión</span>
    <h1>Lo que hay que aclarar</h1>
    <p>Casos del padrón que no cuadran o que esperan una decisión del comité. Cuando se resuelvan en la hoja, desaparecen de aquí.</p>
  </div>
  <div id="olas"></div>
</div>

<main>
  <section class="sube">
    <div class="tarjeta" id="grupos"><p class="vacio">Cargando el padrón…</p></div>
  </section>
</main>

<script src="js/config.js?v=20261125"></script>
<script src="js/padron-copia.js?v=20261125"></script>
<script src="js/agua.js?v=20261125"></script>
<script>
(async function () {
  const A = window.AGUA, C = window.AGUA_CONFIG;
  A.pintarMarco('pendientes.html');
  document.getElementById('olas').outerHTML = A.OLAS;
  const datos = await A.cargar();
  const P = datos.padron;
  const nota = (t) => t.notas.length ? ' · «' + A.esc(t.notas.join(' · ')) + '»' : '';
  const linea = (t, extra) => '<div class="ficha"><div class="quien"><span class="toma">' + (t.toma || 's/n') + '</span> ' + A.esc(t.nombre) + '</div>' +
    '<div class="det">' + A.esc(t.barrio) + ' · ' + A.esc(t.fuente) + nota(t) + (extra ? ' · ' + extra : '') + '</div></div>';

  const grupos = [
    { id: 'no-existe', t: 'Tomas que dicen que no existen', d: 'Revisar en campo y, si es cierto, darlas de baja en el padrón para que no cuenten como adeudo.',
      l: P.tomas.filter((t) => t.noExiste && t.estado !== 'cortada') },
    { id: 'corte', t: 'Piden corte o hay que revisar', d: 'Personas que pidieron que les corten la toma, o casos con una nota para revisar.',
      l: P.tomas.filter((t) => t.estado === 'aclarar' && !t.noExiste) },
    { id: 'parcial', t: 'Pagaron menos de la cuota', d: 'Tienen recibo de ' + P.actual + ' pero por menos de $' + C.CUOTA + '. ¿Fue un acuerdo o les falta?',
      l: P.tomas.filter((t) => t.estado === 'parcial'), x: (t) => 'pagó ' + A.pesos(t.pagos[P.actual].monto) },
    { id: 'sueltos', t: 'Pagos anotados sin número de toma', d: 'Renglones al final del padrón: instalaciones o pagos que hay que pasar a su toma (o darle número a la toma nueva).',
      l: P.sueltos, x: (t) => P.anios.filter((a) => t.pagos[a.anio].pagado).map((a) => a.anio + ': ' + A.pesos(t.pagos[a.anio].monto) + ' recibo ' + A.esc(t.pagos[a.anio].recibo)).join(' · ') || 'sin monto' },
    { id: 'sin-previo', t: 'Sin recibo de ' + P.previo, d: 'Tomas activas que no tienen recibo de la anualidad ' + P.previo + '. Puede que se haya cobrado y no se anotó.',
      l: P.tomas.filter((t) => t.sinReciboPrevio), x: (t) => (t.estado === 'pagada' ? 'sí pagó ' + P.actual : t.estado === 'debe' ? 'tampoco pagó ' + P.actual : 'por aclarar') },
    { id: 'sin-mapa', t: 'Tomas sin barrio o sin ubicación', d: 'Les falta el barrio o las coordenadas en el padrón, por eso no salen en el mapa.',
      l: P.tomas.filter((t) => t.barrio === 'Sin barrio' || !isFinite(t.x)) },
    { id: 'cortadas', t: 'Tomas cortadas', d: 'Están en el padrón como corte. No se les cobra mientras sigan cortadas. Si alguna se reconecta: $' + C.TOMA_NUEVA + ' de toma nueva más $' + C.RECARGO + ' de multa (art. 10).',
      l: P.tomas.filter((t) => t.estado === 'cortada'), info: true },
    { id: 'comunidad', t: 'Tomas de la comunidad', d: 'No pagan anualidad.', l: P.tomas.filter((t) => t.estado === 'exenta'), info: true }
  ];

  document.getElementById('grupos').innerHTML = grupos.filter((g) => g.l.length).map((g) =>
    '<div class="grupo" id="' + g.id + '"><h3>' + g.t + ' <span class="cuenta"' + (g.info ? ' style="background:#eceff0;color:#5d6d76"' : '') + '>' + g.l.length + '</span></h3><p>' + g.d + '</p>' +
    g.l.map((t) => linea(t, g.x && g.x(t))).join('') + '</div>'
  ).join('') + A.avisoFuente(datos);
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
})();
</script>
</body>
</html>
